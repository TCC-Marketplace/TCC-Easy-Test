<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>จัดการเมนูถามตอบ · TCC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f14;--panel:#141821;--panel2:#1a1f2b;--line:#262c3a;--tx:#e8eaf0;--mute:#8d95a8;--acc:#e0a526;--accbg:rgba(224,165,38,.12);--ok:#3fb27f;--warn:#e08a2b;--bad:#e0584f;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 "IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hide{display:none!important}
/* login */
.login{max-width:380px;margin:12vh auto 0;padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.login h1{margin:0 0 4px;font-size:20px;font-weight:600}
.login p{margin:0 0 18px;color:var(--mute)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.seg button{padding:8px;border:1px solid var(--line);background:transparent;border-radius:8px;color:var(--mute)}
.seg button.on{border-color:var(--acc);color:var(--acc);background:var(--accbg)}
.inp,select.inp,textarea.inp{width:100%;padding:9px 11px;background:var(--bg);border:1px solid var(--line);border-radius:8px}
textarea.inp{resize:vertical;min-height:130px;line-height:1.6}
.inp:focus{border-color:var(--acc);outline:none}
.btn{padding:8px 14px;border:1px solid var(--line);background:var(--panel2);border-radius:8px}
.btn:hover{border-color:#3a4254}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#1a1405;font-weight:600}
.btn.pri:hover{filter:brightness(1.06)}
.btn.dng{color:var(--bad);border-color:rgba(224,88,79,.4);background:transparent}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.err{color:var(--bad);margin:10px 0 0;min-height:20px}
/* shell */
.top{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top h1{margin:0;font-size:16px;font-weight:600}
.tabs{display:flex;gap:4px;margin-left:8px}
.tabs button{padding:6px 14px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--mute)}
.tabs button.on{color:var(--acc);border-color:var(--acc)}
.who{margin-left:auto;color:var(--mute);display:flex;gap:12px;align-items:center}
.wrap{padding:18px 20px 60px;max-width:1280px;margin:0 auto}
.split{display:grid;grid-template-columns:minmax(300px,390px) 1fr;gap:18px;align-items:start}
@media(max-width:860px){.split{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.card>header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.card>header h2{margin:0;font-size:14.5px;font-weight:600;flex:1}
.pad{padding:14px}
.muted{color:var(--mute)}
/* tree */
.cat{display:flex;align-items:center;gap:4px;padding:3px 6px 3px 8px;border-left:3px solid transparent}
.cat.sub{margin-left:22px}
.cat.sel{background:var(--accbg);border-left-color:var(--acc)}
.cat.off .cname{opacity:.5}
.cname{flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:7px 4px;display:flex;gap:8px;align-items:center}
.cname .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{color:var(--mute);font-size:12px}
.tools{display:flex;gap:2px;flex:none}
.tools button{width:26px;height:26px;border:0;border-radius:6px;background:transparent;color:var(--mute)}
.tools button:hover{background:var(--panel2);color:var(--tx)}
.tools button:disabled{opacity:.25;cursor:default}
.chip{display:inline-block;padding:0 8px;border-radius:99px;font-size:12px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:rgba(63,178,127,.4)}
.chip.warn{color:var(--warn);border-color:rgba(224,138,43,.45)}
.chip.bad{color:var(--bad);border-color:rgba(224,88,79,.4)}
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .q{flex:1;min-width:0}
.row .q b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis}
.row .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.row.off .q b{opacity:.55}
.empty{padding:40px 20px;text-align:center;color:var(--mute)}
/* dialog */
dialog{width:min(780px,calc(100vw - 20px));max-height:92vh;padding:0;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--tx)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.dh h3{margin:0;font-size:15.5px;font-weight:600;flex:1}
.db{padding:16px 18px;display:grid;gap:12px}
.df{display:flex;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--panel);flex-wrap:wrap}
.df .sp{flex:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.g2{grid-template-columns:1fr}}
label.l{display:block;margin-bottom:4px;color:var(--mute);font-size:13px}
.checks{display:flex;gap:18px;flex-wrap:wrap}
.checks label{display:flex;gap:8px;align-items:center}
.ltabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.ltabs button{padding:7px 12px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--mute);display:flex;gap:6px;align-items:center}
.ltabs button.on{color:var(--acc);border-color:var(--acc)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dot.f{background:var(--ok)}.dot.r{background:var(--warn)}
.notice{padding:9px 12px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.notice.warn{border-color:rgba(224,138,43,.5);color:var(--warn)}
.notice.bad{border-color:rgba(224,88,79,.5);color:var(--bad)}
.notice ul{margin:4px 0 0;padding-left:18px}
.keybox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;padding:12px;background:var(--bg);border:1px dashed var(--acc);border-radius:8px;word-break:break-all;user-select:all}
/* preview */
.pv{max-width:430px;margin:0 auto}
.pvchips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}
.pvchips button{flex:none;padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:transparent;white-space:nowrap}
.pvchips button.on{border-color:var(--acc);color:var(--acc);background:var(--accbg)}
.pvchips.s button{font-size:12.5px;padding:3px 10px;color:var(--mute)}
.pvq{display:block;width:100%;text-align:left;padding:10px 12px;margin:0 0 6px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.pva{padding:12px;border-radius:10px;background:#0f2a1c;border:1px solid #1f5a3b;white-space:pre-wrap;margin-top:8px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:9px 16px;border-radius:99px;z-index:50}
#toast.ok{border-color:var(--ok)}#toast.bad{border-color:var(--bad)}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<div id="toast" class="hide" role="status"></div>
<script>
"use strict";
const DEFAULT_API = "https://line-chat-worker.tcc-team-developer.workers.dev";
const API = (new URLSearchParams(location.search).get("api") || DEFAULT_API).replace(/\/$/, "");
const LANGS = ["th", "en", "vi", "kh", "mm", "la"];
const LNAME = { th: "ไทย", en: "English", vi: "Tiếng Việt", kh: "ខ្មែរ", mm: "မြန်မာ", la: "ລາວ" };
const ACT = { "cat.create": "เพิ่มหมวด", "cat.update": "แก้หมวด", "cat.delete": "ลบหมวด", "cat.move": "เลื่อนหมวด", "faq.create": "เพิ่มคำถาม", "faq.update": "แก้คำถาม", "faq.delete": "ลบคำถาม", "faq.move": "เลื่อนคำถาม", "editor.create": "เพิ่มผู้แก้ไข", "editor.enable": "เปิดสิทธิ์ผู้แก้ไข", "editor.disable": "ปิดสิทธิ์ผู้แก้ไข", "editor.reset": "รีเซ็ตรหัสผู้แก้ไข" };
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nums = (s) => (String(s || "").match(/\d+(?:[.,]\d+)*/g) || []).sort().join("|");
const nm = (c, l) => (c && c.name && (c.name[l] || c.name.th)) || (c ? c.id : "");

const S = { tok: sessionStorage.getItem("kbTok") || "", role: sessionStorage.getItem("kbRole") || "", name: sessionStorage.getItem("kbName") || "",
  cats: [], faq: [], editors: [], log: [], tab: "", sel: "", loginMode: "editor", err: "", busy: false, pv: { lang: "th", cat: "", sub: "", open: "" } };
let FD = null, CD = null;   // ฟอร์มคำถาม / ฟอร์มหมวด ที่กำลังแก้

async function api(path, body) {
  const r = await fetch(API + path, { method: body === undefined ? "GET" : "POST", headers: { "Content-Type": "application/json", ...(S.tok ? { Authorization: "Bearer " + S.tok } : {}) }, body: body === undefined ? undefined : JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && S.tok) { logout(); throw { status: 401, data: j }; }
  if (!r.ok) throw { status: r.status, data: j };
  return j;
}
const errText = (e) => (e && e.data && (e.data.errors ? e.data.errors.join(" · ") : e.data.error)) || "เชื่อมต่อไม่สำเร็จ";
let tt = 0;
function toast(msg, kind) { const t = $("#toast"); t.textContent = msg; t.className = kind || ""; clearTimeout(tt); tt = setTimeout(() => t.classList.add("hide"), 3200); }

function logout() { sessionStorage.clear(); Object.assign(S, { tok: "", role: "", name: "", cats: [], faq: [], editors: [], log: [], loginMode: "editor", err: "" }); closeDlg(); render(); }
async function login() {
  const key = $("#key").value.trim(); if (!key) return;
  S.busy = true; S.err = ""; render();
  try {
    const owner = S.loginMode === "owner";
    const j = await fetch(API + (owner ? "/api/admin/session" : "/api/kb/editor/session"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key }) });
    const d = await j.json().catch(() => ({}));
    if (!j.ok || !d.token) throw 0;
    S.tok = d.token; S.role = owner ? "owner" : "editor"; S.name = owner ? "เจ้าของระบบ" : (d.me && d.me.name) || "ผู้แก้ไข";
    sessionStorage.setItem("kbTok", S.tok); sessionStorage.setItem("kbRole", S.role); sessionStorage.setItem("kbName", S.name);
    S.tab = S.role === "owner" ? "editors" : "menu"; S.busy = false; await loadTab();
  } catch (_) { S.busy = false; S.err = "รหัสไม่ถูกต้อง หรือสิทธิ์ถูกปิด"; render(); }
}
async function loadTab() {
  try {
    if (S.tab === "menu" || S.tab === "preview") { const d = await api("/api/kb/admin/tree"); S.cats = d.cats; S.faq = d.faq; if (!S.cats.some((c) => c.id === S.sel)) S.sel = (S.cats.find((c) => !c.parent_id) || {}).id || ""; }
    else if (S.tab === "log") S.log = (await api("/api/kb/admin/log?limit=150")).log;
    else if (S.tab === "editors") S.editors = (await api("/api/kb/editors")).editors;
  } catch (e) { if (S.tok) toast(errText(e), "bad"); }
  render();
}

/* ---------- ข้อมูลที่ใช้แสดง ---------- */
const kids = (id) => S.cats.filter((c) => c.parent_id === id);
const tops = () => S.cats.filter((c) => !c.parent_id);
const faqOf = (id) => S.faq.filter((f) => f.cat_id === id);
const sibs = (c) => S.cats.filter((k) => (k.parent_id || "") === (c.parent_id || ""));
function catOptions(sel, exceptId) {
  let o = ""; for (const c of tops()) { o += `<option value="${esc(c.id)}"${c.id === sel ? " selected" : ""}>${esc(nm(c, "th"))}</option>`; for (const k of kids(c.id)) o += `<option value="${esc(k.id)}"${k.id === sel ? " selected" : ""}>${"\u00a0\u00a0\u00a0"}${esc(nm(k, "th"))}</option>`; }
  return o;
}
// เมนูที่สมาชิกจะเห็นจริง (กติกาเดียวกับ Worker: เปิดแสดง + เผยแพร่แล้ว + มีคำตอบไทย + อยู่ในเมนู)
function liveTree() {
  const by = new Map(S.cats.map((c) => [c.id, c]));
  const ok = (c) => c.visible && (!c.parent_id || (by.get(c.parent_id) && by.get(c.parent_id).visible && !by.get(c.parent_id).parent_id));
  const items = (id) => S.faq.filter((f) => f.cat_id === id && f.visible && f.status === "published" && f.menu && String(f.a.th || "").trim());
  return tops().filter(ok).map((c) => ({ ...c, items: items(c.id), children: kids(c.id).filter(ok).map((k) => ({ ...k, items: items(k.id) })).filter((k) => k.items.length) })).filter((c) => c.items.length || c.children.length);
}

/* ---------- วาดหน้า ---------- */
function render() {
  const app = $("#app");
  if (!S.tok) { app.innerHTML = loginView(); return; }
  const owner = S.role === "owner";
  const tabs = owner ? [["editors", "ผู้แก้ไข"], ["log", "ประวัติ"]] : [["menu", "เมนู"], ["preview", "ตัวอย่างที่สมาชิกเห็น"], ["log", "ประวัติ"]];
  app.innerHTML = `<div class="top"><h1>จัดการเมนูถามตอบ</h1>
    <nav class="tabs">${tabs.map(([k, n]) => `<button data-act="tab" data-v="${k}" class="${S.tab === k ? "on" : ""}">${n}</button>`).join("")}</nav>
    <div class="who"><span>${esc(S.name)}</span><button class="btn sm" data-act="logout">ออกจากระบบ</button></div></div>
    <div class="wrap">${S.tab === "menu" ? menuView() : S.tab === "preview" ? previewView() : S.tab === "log" ? logView() : editorsView()}</div>`;
}
function loginView() {
  return `<div class="login"><h1>จัดการเมนูถามตอบ</h1><p>เฉพาะผู้ที่ได้รับสิทธิ์เท่านั้น</p>
  <div class="seg"><button data-act="lmode" data-v="editor" class="${S.loginMode === "editor" ? "on" : ""}">ผู้แก้ไข</button><button data-act="lmode" data-v="owner" class="${S.loginMode === "owner" ? "on" : ""}">เจ้าของระบบ</button></div>
  <input id="key" class="inp" type="password" autocomplete="off" placeholder="${S.loginMode === "owner" ? "ADMIN_KEY" : "รหัสผู้แก้ไข (kbe_…)"}" onkeydown="if(event.key==='Enter')login()">
  <div class="err">${esc(S.err)}</div><button class="btn pri" style="width:100%;margin-top:6px" onclick="login()" ${S.busy ? "disabled" : ""}>${S.busy ? "กำลังเข้าสู่ระบบ…" : "เข้าสู่ระบบ"}</button>
  ${S.loginMode === "owner" ? '<p class="muted" style="margin:12px 0 0;font-size:13px">เจ้าของระบบจัดการรายชื่อผู้แก้ไขและดูประวัติได้ แต่แก้เนื้อหาไม่ได้ ต้องออกรหัสผู้แก้ไขให้ตัวเอง</p>' : ""}</div>`;
}
function catRow(c) {
  const n = faqOf(c.id).length, sb = sibs(c), i = sb.indexOf(c);
  return `<div class="cat ${c.parent_id ? "sub" : ""} ${S.sel === c.id ? "sel" : ""} ${c.visible ? "" : "off"}">
    <button class="cname" data-act="selcat" data-id="${esc(c.id)}"><span>${esc(c.icon)}</span><span class="t">${esc(nm(c, "th"))}</span><span class="cnt">${n}</span>${c.visible ? "" : '<span class="chip">ซ่อน</span>'}</button>
    <span class="tools"><button data-act="mvcat" data-id="${esc(c.id)}" data-to="first" title="ไปหน้าสุด" aria-label="ไปหน้าสุด" ${i === 0 ? "disabled" : ""}>⇈</button><button data-act="mvcat" data-id="${esc(c.id)}" data-to="up" title="เลื่อนขึ้น" aria-label="เลื่อนขึ้น" ${i === 0 ? "disabled" : ""}>↑</button><button data-act="mvcat" data-id="${esc(c.id)}" data-to="down" title="เลื่อนลง" aria-label="เลื่อนลง" ${i === sb.length - 1 ? "disabled" : ""}>↓</button><button data-act="mvcat" data-id="${esc(c.id)}" data-to="last" title="ไปท้ายสุด" aria-label="ไปท้ายสุด" ${i === sb.length - 1 ? "disabled" : ""}>⇊</button></span></div>`;
}
function menuView() {
  const sel = S.cats.find((c) => c.id === S.sel);
  const list = sel ? faqOf(sel.id) : [];
  return `<div class="split"><aside class="card"><header><h2>หมวดทั้งหมด</h2><button class="btn sm pri" data-act="newcat">+ หมวดหลัก</button></header>
    ${tops().map((c) => catRow(c) + kids(c.id).map(catRow).join("")).join("") || '<div class="empty">ยังไม่มีหมวด</div>'}</aside>
  <section class="card">${sel ? `<header><h2>${esc(sel.icon)} ${esc(nm(sel, "th"))}${sel.parent_id ? ' <span class="chip">หมวดย่อย</span>' : ""}</h2>
      <button class="btn sm" data-act="editcat" data-id="${esc(sel.id)}">แก้หมวด</button>${sel.parent_id ? "" : `<button class="btn sm" data-act="newsub" data-id="${esc(sel.id)}">+ หมวดย่อย</button>`}<button class="btn sm pri" data-act="newfaq">+ คำถาม</button></header>
    ${list.map((f, i) => faqRow(f, i, list.length)).join("") || '<div class="empty">หมวดนี้ยังไม่มีคำถาม</div>'}` : '<div class="empty">เลือกหมวดทางซ้าย</div>'}</section></div>`;
}
function faqRow(f, i, n) {
  const chips = [f.status === "published" ? '<span class="chip ok">เผยแพร่</span>' : '<span class="chip warn">ฉบับร่าง</span>'];
  if (f.review && f.review.length) chips.push(`<span class="chip warn">รอตรวจ ${f.review.length} ภาษา</span>`);
  if (!f.visible) chips.push('<span class="chip">ซ่อน</span>');
  if (!f.menu) chips.push('<span class="chip">ไม่อยู่ในเมนู</span>');
  const miss = LANGS.filter((l) => !String((f.a || {})[l] || "").trim()).length; if (miss && f.status === "published") chips.push(`<span class="chip bad">ขาด ${miss} ภาษา</span>`);
  return `<div class="row ${f.visible ? "" : "off"}"><div class="q"><b>${esc((f.q && f.q.th) || f.id)}</b><div class="meta">${chips.join("")}<span class="muted" style="font-size:12px">${esc(f.id)}</span></div></div>
    <span class="tools"><button data-act="mvfaq" data-id="${esc(f.id)}" data-to="first" title="ไปหน้าสุด" ${i === 0 ? "disabled" : ""}>⇈</button><button data-act="mvfaq" data-id="${esc(f.id)}" data-to="up" title="เลื่อนขึ้น" ${i === 0 ? "disabled" : ""}>↑</button><button data-act="mvfaq" data-id="${esc(f.id)}" data-to="down" title="เลื่อนลง" ${i === n - 1 ? "disabled" : ""}>↓</button><button data-act="mvfaq" data-id="${esc(f.id)}" data-to="last" title="ไปท้ายสุด" ${i === n - 1 ? "disabled" : ""}>⇊</button></span>
    <button class="btn sm" data-act="editfaq" data-id="${esc(f.id)}">แก้ไข</button></div>`;
}
function previewView() {
  const t = liveTree(), P = S.pv, L = P.lang;
  if (!t.some((c) => c.id === P.cat)) { P.cat = (t[0] || {}).id || ""; P.sub = ""; P.open = ""; }
  const top = t.find((c) => c.id === P.cat);
  let cur = top, subs = "";
  if (top && top.children.length) {
    const tabs = (top.items.length ? [top] : []).concat(top.children);
    if (!tabs.some((k) => k.id === P.sub)) P.sub = tabs[0].id;
    cur = tabs.find((k) => k.id === P.sub);
    subs = `<div class="pvchips s">${tabs.map((k) => `<button data-act="pvsub" data-id="${esc(k.id)}" class="${k.id === P.sub ? "on" : ""}">${k === top ? "" : esc(k.icon) + " "}${esc(nm(k, L))}</button>`).join("")}</div>`;
  }
  const open = cur && cur.items.find((f) => f.id === P.open);
  return `<div class="pv"><div class="notice" style="margin-bottom:12px">ตัวอย่างนี้คำนวณจากข้อมูลล่าสุดในหน้านี้ด้วยกติกาเดียวกับที่สมาชิกเห็น (ฉบับร่าง/ซ่อน จะไม่ปรากฏ) · ภาษา
    <select class="inp" style="width:auto;display:inline-block;padding:3px 8px" data-act="pvlang">${LANGS.map((l) => `<option value="${l}"${l === L ? " selected" : ""}>${LNAME[l]}</option>`).join("")}</select></div>
    ${top ? `<div class="pvchips">${t.map((c) => `<button data-act="pvcat" data-id="${esc(c.id)}" class="${c.id === P.cat ? "on" : ""}">${esc(c.icon)} ${esc(nm(c, L))}</button>`).join("")}</div>${subs}
    ${cur.items.map((f) => `<button class="pvq" data-act="pvq" data-id="${esc(f.id)}">${esc(f.q[L] || f.q.th)}</button>`).join("")}
    ${open ? `<div class="pva">${esc(open.a[L] || open.a.th)}</div>` : ""}` : '<div class="empty">ยังไม่มีเมนูที่เผยแพร่</div>'}</div>`;
}
function logView() {
  return `<section class="card"><header><h2>ประวัติการแก้ไขล่าสุด</h2><button class="btn sm" data-act="reload">รีเฟรช</button></header>
  <div style="overflow-x:auto"><table><thead><tr><th>เวลา</th><th>ผู้ทำ</th><th>การกระทำ</th><th>รายการ</th></tr></thead><tbody>
  ${S.log.map((r) => `<tr><td class="muted" style="white-space:nowrap">${new Date(r.ts).toLocaleString("th-TH")}</td><td>${esc(r.editor)}</td><td>${esc(ACT[r.action] || r.action)}</td><td>${esc(r.target)}</td></tr>`).join("") || '<tr><td colspan="4" class="empty">ยังไม่มีประวัติ</td></tr>'}</tbody></table></div></section>`;
}
function editorsView() {
  return `<section class="card" style="max-width:760px"><header><h2>ผู้แก้ไขที่ได้รับสิทธิ์</h2></header>
  <div class="pad" style="display:flex;gap:8px;border-bottom:1px solid var(--line)"><input id="newed" class="inp" placeholder="ชื่อผู้แก้ไขคนใหม่" maxlength="40" onkeydown="if(event.key==='Enter')act_addEditor()"><button class="btn pri" style="white-space:nowrap" data-act="added">ออกรหัส</button></div>
  ${S.editors.map((e) => `<div class="row"><div class="q"><b>${esc(e.name)}</b><div class="meta"><span class="chip ${e.active ? "ok" : "bad"}">${e.active ? "ใช้งานได้" : "ปิดสิทธิ์"}</span><span class="muted" style="font-size:12px">เพิ่มเมื่อ ${new Date(e.created_at).toLocaleDateString("th-TH")}</span></div></div>
    <button class="btn sm" data-act="toged" data-id="${e.id}" data-on="${e.active ? 0 : 1}">${e.active ? "ปิดสิทธิ์" : "เปิดสิทธิ์"}</button><button class="btn sm" data-act="resed" data-id="${e.id}">รีเซ็ตรหัส</button></div>`).join("") || '<div class="empty">ยังไม่มีผู้แก้ไข</div>'}
  <div class="pad muted" style="font-size:13px">รหัสแสดงครั้งเดียวตอนออกให้ ระบบเก็บเฉพาะค่าเข้ารหัส · ปิดสิทธิ์แล้วผู้นั้นใช้งานต่อไม่ได้ทันที</div></section>`;
}

/* ---------- Dialog ---------- */
const dlg = () => $("#dlg");
function openDlg(html) { const d = dlg(); d.innerHTML = html; if (!d.open) d.showModal(); }
function closeDlg() { const d = dlg(); if (d.open) d.close(); FD = CD = null; }
const errBox = (list) => (list && list.length ? `<div class="notice bad"><b>บันทึกไม่ได้</b><ul>${list.map((e) => `<li>${esc(e)}</li>`).join("")}</ul></div>` : "");

function catDlg(errs) {
  const c = CD, ownKids = c.create ? 0 : kids(c.id).length;
  const parents = tops().filter((p) => p.id !== c.id);
  openDlg(`<div class="dh"><h3>${c.create ? (c.parent_id ? "เพิ่มหมวดย่อย" : "เพิ่มหมวดหลัก") : "แก้ไขหมวด"}</h3><button class="btn sm" data-act="close">ปิด</button></div>
  <div class="db">${errBox(errs)}
   <div class="g2"><div><label class="l">รหัสหมวด (a-z 0-9 _ แก้ภายหลังไม่ได้)</label><input class="inp" data-c="id" value="${esc(c.id)}" ${c.create ? "" : "readonly"} maxlength="41"></div>
   <div><label class="l">ไอคอน (อีโมจิ)</label><input class="inp" data-c="icon" value="${esc(c.icon)}" maxlength="8"></div></div>
   <div class="g2"><div><label class="l">อยู่ใต้หมวด</label><select class="inp" data-c="parent_id" ${ownKids ? "disabled" : ""}><option value="">— หมวดหลัก —</option>${parents.map((p) => `<option value="${esc(p.id)}"${p.id === c.parent_id ? " selected" : ""}>${esc(nm(p, "th"))}</option>`).join("")}</select></div>
   <div class="checks" style="align-self:end"><label><input type="checkbox" data-c="visible" ${c.visible ? "checked" : ""}> แสดงให้สมาชิกเห็น</label></div></div>
   <div><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><label class="l" style="margin:0;flex:1">ชื่อหมวด 6 ภาษา (ภาษาไทยจำเป็น · แสดงให้สมาชิกต้องครบ)</label><button class="btn sm" data-act="aicat" ${S._ai ? "disabled" : ""}>${S._ai ? "AI กำลังแปล…" : "ให้ AI แปลจากภาษาไทย"}</button></div>
    <div class="g2">${LANGS.map((l) => `<div><label class="l">${LNAME[l]}</label><input class="inp" data-c="name:${l}" value="${esc(c.name[l] || "")}" maxlength="60"></div>`).join("")}</div></div>
   <div><label class="l">คำสำคัญให้ระบบเลือกหมวดจากข้อความที่สมาชิกพิมพ์ (คั่นคำด้วย | · ไม่ต้องกรอกทุกภาษา)</label>
    <div class="g2">${LANGS.map((l, i) => `<div><label class="l">${LNAME[l]}</label><input class="inp" data-c="kw:${i}" value="${esc(c.kw[i] || "")}" placeholder="เช่น โปรโมชั่น|โปร" maxlength="400"></div>`).join("")}</div></div></div>
  <div class="df">${c.create ? "" : '<button class="btn dng" data-act="delcat">ลบหมวด</button>'}<span class="sp"></span><button class="btn" data-act="close">ยกเลิก</button><button class="btn pri" data-act="savecat">บันทึก</button></div>`);
}
function faqDlg(errs) {
  const f = FD, L = f.lang, base = nums(f.a.th);
  const warnNum = L !== "th" && String(f.a[L] || "").trim() && nums(f.a[L]) !== base;
  const rev = f.review.includes(L);
  openDlg(`<div class="dh"><h3>${f.create ? "เพิ่มคำถาม" : "แก้ไขคำถาม"}</h3><button class="btn sm" data-act="close">ปิด</button></div>
  <div class="db">${errBox(errs)}
   <div class="g2"><div><label class="l">หมวด</label><select class="inp" data-f="cat_id">${catOptions(f.cat_id)}</select></div>
   <div><label class="l">รหัสคำถาม (a-z 0-9 _ แก้ภายหลังไม่ได้)</label><input class="inp" data-f="id" value="${esc(f.id)}" ${f.create ? "" : "readonly"} maxlength="41" placeholder="เช่น promo_now"></div></div>
   <div class="checks"><label><input type="checkbox" data-f="menu" ${f.menu ? "checked" : ""}> แสดงเป็นปุ่มในเมนู</label><label><input type="checkbox" data-f="visible" ${f.visible ? "checked" : ""}> เปิดใช้งาน (ปิด = ซ่อนจากสมาชิก)</label></div>
   <div class="ltabs">${LANGS.map((l) => `<button data-act="flang" data-v="${l}" class="${l === L ? "on" : ""}"><span class="dot ${f.review.includes(l) ? "r" : String(f.a[l] || "").trim() ? "f" : ""}"></span>${LNAME[l]}</button>`).join("")}</div>
   <div><label class="l">คำถาม (${LNAME[L]})</label><input class="inp" data-f="q" value="${esc(f.q[L] || "")}" maxlength="200"></div>
   <div><label class="l">คำตอบ (${LNAME[L]})</label><textarea class="inp" data-f="a" maxlength="3000">${esc(f.a[L] || "")}</textarea></div>
   ${L === "th" ? `<div class="notice">กรอกภาษาไทยก่อน แล้วกด <b>ให้ AI ร่าง 5 ภาษา</b> · ตัวเลข ค่าธรรมเนียม และเปอร์เซ็นต์ต้องตรงกับฉบับไทย · ห้ามใส่ลิงก์และเลขกระเป๋า · อย่าใส่คำแนะนำให้ซื้อ/ขายหรือรับประกันกำไร</div>` : ""}
   ${rev ? `<div class="notice warn">ภาษานี้ AI ร่างให้ ยังไม่ผ่านการตรวจ — อ่านแล้วแก้ให้ถูกต้อง จากนั้นกด “ยืนยันว่าตรวจแล้ว” <button class="btn sm" data-act="okrev">ยืนยันว่าตรวจแล้ว (${LNAME[L]})</button></div>` : ""}
   ${warnNum ? `<div class="notice bad">ตัวเลขในภาษานี้ไม่ตรงกับฉบับไทย (${esc(nums(f.a[L]) || "ไม่มี")} ≠ ${esc(base || "ไม่มี")})</div>` : ""}
   <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn" data-act="aifaq" ${S._ai ? "disabled" : ""}>${S._ai ? "AI กำลังแปล… (ประมาณครึ่งนาที)" : "ให้ AI ร่าง 5 ภาษา"}</button>
     ${f.review.length ? `<button class="btn" data-act="okall">ยืนยันว่าตรวจครบทุกภาษา (${f.review.length} ภาษารอตรวจ)</button>` : ""}
     <span class="muted" style="font-size:13px">สถานะตอนนี้: ${f.status === "published" ? "เผยแพร่แล้ว" : "ฉบับร่าง"}</span></div></div>
  <div class="df">${f.create ? "" : '<button class="btn dng" data-act="delfaq">ลบ</button>'}<span class="sp"></span><button class="btn" data-act="savefaq" data-st="draft">บันทึกเป็นฉบับร่าง</button><button class="btn pri" data-act="savefaq" data-st="published">บันทึกและเผยแพร่</button></div>`);
}
const blankFaq = (cat) => ({ create: true, id: "", cat_id: cat || S.sel, menu: true, visible: true, status: "draft", q: {}, a: {}, review: [], lang: "th" });

/* ---------- การกระทำ ---------- */
async function doMove(kind, id, to) {
  try { await api("/api/kb/admin/" + kind, { action: "move", id, to }); await loadTab(); }
  catch (e) { toast(errText(e), "bad"); }
}
async function saveCat() {
  const c = CD, kw = LANGS.map((_, i) => String(c.kw[i] || "").trim());
  try { await api("/api/kb/admin/cat", { action: "save", create: c.create, cat: { id: c.id.trim(), icon: c.icon.trim(), parent_id: c.parent_id, name: c.name, kw, visible: c.visible } });
    const keep = c.id.trim(); closeDlg(); toast("บันทึกหมวดแล้ว", "ok"); S.sel = keep; await loadTab();
  } catch (e) { catDlg(e.data && e.data.errors ? e.data.errors : [errText(e)]); }
}
async function saveFaq(status) {
  const f = FD;
  try { await api("/api/kb/admin/faq", { action: "save", create: f.create, faq: { id: f.id.trim(), cat_id: f.cat_id, menu: f.menu, visible: f.visible, status, q: f.q, a: f.a, review: f.review } });
    S.sel = f.cat_id; closeDlg(); toast(status === "published" ? "เผยแพร่แล้ว — สมาชิกเห็นภายใน 1 นาที" : "บันทึกฉบับร่างแล้ว", "ok"); await loadTab();
  } catch (e) { faqDlg(e.data && e.data.errors ? e.data.errors : [errText(e)]); }
}
async function aiFaq() {
  const f = FD; if (!String(f.q.th || "").trim() || !String(f.a.th || "").trim()) return toast("กรอกคำถามและคำตอบภาษาไทยก่อน", "bad");
  if (LANGS.some((l) => l !== "th" && String(f.a[l] || "").trim()) && !confirm("ภาษาอื่นที่กรอกไว้แล้วจะถูกแทนที่ด้วยฉบับร่างจาก AI ต้องการทำต่อหรือไม่?")) return;
  S._ai = true; faqDlg();
  try {
    const d = await api("/api/kb/admin/translate", { q: f.q.th, a: f.a.th });
    const got = Object.keys(d.drafts); for (const l of got) { f.q[l] = d.drafts[l].q; f.a[l] = d.drafts[l].a; }
    f.review = Array.from(new Set(f.review.concat(got))); const bad = got.filter((l) => !d.drafts[l].numOk);
    S._ai = false; faqDlg(); f.lang = got[0] || f.lang;
    toast(d.failed.length ? `AI แปลไม่สำเร็จ: ${d.failed.join(", ")} (กดอีกครั้งเพื่อลองใหม่)` : bad.length ? `ตัวเลขไม่ตรงในภาษา: ${bad.join(", ")} — ตรวจก่อนบันทึก` : "AI ร่างครบแล้ว — ตรวจทุกภาษาก่อนเผยแพร่", bad.length || d.failed.length ? "bad" : "ok");
    faqDlg();
  } catch (e) { S._ai = false; faqDlg([errText(e)]); }
}
async function aiCat() {
  const c = CD; if (!String(c.name.th || "").trim()) return toast("กรอกชื่อหมวดภาษาไทยก่อน", "bad");
  S._ai = true; catDlg();
  try { const d = await api("/api/kb/admin/translate", { q: c.name.th }); for (const l of Object.keys(d.drafts)) c.name[l] = d.drafts[l].q; S._ai = false; catDlg(); toast(d.failed.length ? `แปลไม่สำเร็จ: ${d.failed.join(", ")}` : "AI แปลชื่อแล้ว — ตรวจก่อนบันทึก", d.failed.length ? "bad" : "ok"); }
  catch (e) { S._ai = false; catDlg([errText(e)]); }
}
function showKey(title, key) {
  openDlg(`<div class="dh"><h3>${esc(title)}</h3></div><div class="db"><div class="notice warn">คัดลอกรหัสนี้ส่งให้ผู้แก้ไขทันที — จะไม่แสดงอีก (ถ้าหาย ให้รีเซ็ตรหัสใหม่)</div><div class="keybox">${esc(key)}</div></div>
  <div class="df"><span class="sp"></span><button class="btn" data-act="copykey" data-k="${esc(key)}">คัดลอก</button><button class="btn pri" data-act="close">เสร็จแล้ว</button></div>`);
}
window.act_addEditor = async () => { const el = $("#newed"); const name = el && el.value.trim(); if (!name) return; try { const d = await api("/api/kb/editors", { action: "create", name }); await loadTab(); showKey("รหัสของ " + d.name, d.key); } catch (e) { toast(errText(e), "bad"); } };

document.addEventListener("click", async (ev) => {
  const b = ev.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act, id = b.dataset.id, v = b.dataset.v;
  if (a === "lmode") { S.loginMode = v; S.err = ""; render(); }
  else if (a === "logout") logout();
  else if (a === "tab") { S.tab = v; await loadTab(); }
  else if (a === "reload") await loadTab();
  else if (a === "selcat") { S.sel = id; render(); }
  else if (a === "mvcat") await doMove("cat", id, b.dataset.to);
  else if (a === "mvfaq") await doMove("faq", id, b.dataset.to);
  else if (a === "newcat") { CD = { create: true, id: "", icon: "", parent_id: "", visible: false, name: {}, kw: [] }; catDlg(); }
  else if (a === "newsub") { CD = { create: true, id: "", icon: "", parent_id: id, visible: false, name: {}, kw: [] }; catDlg(); }
  else if (a === "editcat") { const c = S.cats.find((x) => x.id === id); CD = { create: false, id: c.id, icon: c.icon, parent_id: c.parent_id, visible: c.visible, name: { ...c.name }, kw: LANGS.map((_, i) => c.kw[i] || "") }; catDlg(); }
  else if (a === "savecat") saveCat();
  else if (a === "delcat") { if (confirm("ลบหมวดนี้? (ต้องไม่มีคำถามหรือหมวดย่อยเหลืออยู่)")) try { await api("/api/kb/admin/cat", { action: "delete", id: CD.id }); closeDlg(); toast("ลบหมวดแล้ว", "ok"); await loadTab(); } catch (e) { toast(errText(e), "bad"); } }
  else if (a === "aicat") aiCat();
  else if (a === "newfaq") { FD = blankFaq(); faqDlg(); }
  else if (a === "editfaq") { const f = S.faq.find((x) => x.id === id); FD = { create: false, id: f.id, cat_id: f.cat_id, menu: f.menu, visible: f.visible, status: f.status, q: { ...f.q }, a: { ...f.a }, review: [...(f.review || [])], lang: "th" }; faqDlg(); }
  else if (a === "flang") { FD.lang = v; faqDlg(); }
  else if (a === "okrev") { FD.review = FD.review.filter((l) => l !== FD.lang); faqDlg(); }
  else if (a === "okall") { FD.review = []; faqDlg(); }
  else if (a === "aifaq") aiFaq();
  else if (a === "savefaq") saveFaq(b.dataset.st);
  else if (a === "delfaq") { if (confirm("ลบคำถามนี้ถาวร?")) try { await api("/api/kb/admin/faq", { action: "delete", id: FD.id }); closeDlg(); toast("ลบแล้ว", "ok"); await loadTab(); } catch (e) { toast(errText(e), "bad"); } }
  else if (a === "close") closeDlg();
  else if (a === "pvcat") { S.pv.cat = id; S.pv.sub = ""; S.pv.open = ""; render(); }
  else if (a === "pvsub") { S.pv.sub = id; S.pv.open = ""; render(); }
  else if (a === "pvq") { S.pv.open = S.pv.open === id ? "" : id; render(); }
  else if (a === "added") window.act_addEditor();
  else if (a === "toged") { try { await api("/api/kb/editors", { action: "toggle", id: Number(id), active: b.dataset.on === "1" }); await loadTab(); } catch (e) { toast(errText(e), "bad"); } }
  else if (a === "resed") { if (confirm("รีเซ็ตรหัส? รหัสเดิมจะใช้ไม่ได้ทันที")) try { const d = await api("/api/kb/editors", { action: "reset", id: Number(id) }); showKey("รหัสใหม่", d.key); } catch (e) { toast(errText(e), "bad"); } }
  else if (a === "copykey") { try { await navigator.clipboard.writeText(b.dataset.k); toast("คัดลอกแล้ว", "ok"); } catch (_) { toast("คัดลอกไม่ได้ — ลากคลุมรหัสแล้วคัดลอกเอง", "bad"); } }
});
document.addEventListener("change", (ev) => { const t = ev.target; if (t.dataset.act === "pvlang") { S.pv.lang = t.value; render(); } });
dlg().addEventListener("input", (ev) => {
  const t = ev.target, val = t.type === "checkbox" ? t.checked : t.value;
  if (FD && t.dataset.f) { const k = t.dataset.f; if (k === "q" || k === "a") { FD[k][FD.lang] = val; if (k === "a" && FD.lang === "th") { /* ไทยเปลี่ยน → ตัวเลขเทียบใหม่ตอนสลับแท็บ */ } } else FD[k] = val; }
  else if (CD && t.dataset.c) { const k = t.dataset.c; if (k.startsWith("name:")) CD.name[k.slice(5)] = val; else if (k.startsWith("kw:")) CD.kw[Number(k.slice(3))] = val; else CD[k] = val; }
});
dlg().addEventListener("close", () => { FD = CD = null; S._ai = false; });
if (S.tok) { S.tab = S.role === "owner" ? "editors" : "menu"; loadTab(); } else render();
</script>
</body>
</html>
